<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" [routerLink]="['/tabs/home']" routerLinkActive="tab-selected">
      <ion-icon name="camera"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>
    
    <ion-tab-button tab="progress" [routerLink]="['/tabs/progress']" routerLinkActive="tab-selected">
      <ion-icon name="bar-chart-outline"></ion-icon>
      <ion-label>Progress</ion-label>
    </ion-tab-button>
    
    <ion-tab-button tab="settings" [routerLink]="['/tabs/settings']" routerLinkActive="tab-selected">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
